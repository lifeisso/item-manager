<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拾物</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- 登录/注册页面 -->
    <div id="auth-page" class="page">
        <div class="auth-container">
            <h1>拾物</h1>
            <div class="tab-container">
                <button class="tab-btn active" onclick="switchAuthTab('login')">登录</button>
                <button class="tab-btn" onclick="switchAuthTab('register')">注册</button>
            </div>
            <!-- 登录表单 -->
            <form id="login-form" class="auth-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="login-username" required minlength="3" placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="login-password" required minlength="6" placeholder="请输入密码">
                </div>
                <button type="submit" class="btn btn-primary">登录</button>
            </form>
            <!-- 注册表单 -->
            <form id="register-form" class="auth-form hidden" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="reg-username" required minlength="3" maxlength="50" placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="reg-password" required minlength="6" placeholder="请输入密码(至少6位)">
                </div>
                <div class="form-group">
                    <label>账号类型</label>
                    <div class="radio-group">
                        <label><input type="radio" name="reg-type" value="personal" checked> 个人账号</label>
                        <label><input type="radio" name="reg-type" value="group"> 组账号</label>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">注册</button>
            </form>
        </div>
    </div>

    <!-- 主页面 -->
    <div id="main-page" class="page hidden">
        <nav class="navbar">
            <div class="nav-left">
                <h1>拾物</h1>
            </div>
            <div class="nav-right">
                <span id="user-info" class="user-badge"></span>
                <button class="btn btn-small" onclick="showGroupInfo()">组信息</button>
                <button class="btn btn-small btn-danger" onclick="handleLogout()">退出</button>
            </div>
        </nav>

        <div class="main-content">
            <!-- 侧边栏 -->
            <aside class="sidebar">
                <div class="sidebar-section">
                    <h3>分类管理</h3>
                    <div id="category-list" class="category-list"></div>
                    <button class="btn btn-small btn-add" onclick="showAddCategoryModal()">+ 添加分类</button>
                </div>
                <div class="sidebar-section">
                    <h3>即将过期</h3>
                    <div id="expiring-sidebar" class="expiring-sidebar" onclick="showExpiringItems()">
                        <span class="expiring-icon">⚠️</span>
                        <span id="expiring-count-text">即将过期</span>
                    </div>
                </div>
                <div class="sidebar-section">
                    <h3>保养提醒</h3>
                    <div id="maintenance-sidebar" class="maintenance-sidebar" onclick="showMaintenanceView()">
                        <span class="maintenance-icon">🔧</span>
                        <span id="maintenance-count-text">保养提醒</span>
                    </div>
                </div>
                <div class="sidebar-section">
                    <h3>废物站</h3>
                    <div id="recycle-sidebar" class="recycle-sidebar" onclick="showRecycleBin()">
                        <span class="recycle-icon">🗑️</span>
                        <span id="recycle-count-text">废物站</span>
                    </div>
                </div>
                <div class="sidebar-section">
                    <h3>意见箱</h3>
                    <div class="suggestion-sidebar" onclick="showSuggestionView()">
                        <span class="suggestion-icon">📮</span>
                        <span>意见箱</span>
                    </div>
                </div>
                <div class="sidebar-section">
                    <h3>物品筛选</h3>
                    <div class="filter-group">
                        <label>归属</label>
                        <select id="filter-owner" onchange="loadItems()">
                            <option value="all">全部</option>
                            <option value="self">仅个人</option>
                            <option value="group">仅组共享</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>搜索</label>
                        <input type="text" id="filter-keyword" placeholder="搜索物品..." oninput="debounceLoadItems()">
                    </div>
                </div>
            </aside>

            <!-- 主内容区 -->
            <main class="content">
                <!-- 过期提醒横幅 -->
                <div id="expiry-alert" class="expiry-alert hidden"></div>
                <div class="content-header">
                    <div class="content-title-wrap">
                        <h2 id="content-title">全部物品</h2>
                        <span id="expiring-days-selector" class="hidden"></span>
                        <div id="view-toggle" class="view-toggle">
                            <button id="view-grid-btn" class="active" onclick="toggleViewMode('grid')" title="卡片视图">▦</button>
                            <button id="view-list-btn" onclick="toggleViewMode('list')" title="列表视图">☰</button>
                        </div>
                    </div>
                    <button id="btn-add-item" class="btn btn-primary" onclick="showAddItemModal()">+ 添加物品</button>
                    <button id="btn-add-maint-plan" class="btn btn-primary hidden" onclick="showAddMaintPlanModal()">+ 添加保养计划</button>
                </div>
                <div id="items-grid" class="items-grid">
                    <!-- 物品卡片将通过JS动态生成 -->
                </div>
                <div id="pagination" class="pagination"></div>
            </main>
        </div>
    </div>

    <!-- 模态框：添加/编辑分类 -->
    <div id="category-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="category-modal-title">添加分类</h3>
                <button class="modal-close" onclick="closeModal('category-modal')">&times;</button>
            </div>
            <form onsubmit="handleCategorySubmit(event)">
                <input type="hidden" id="category-edit-id">
                <div class="form-group">
                    <label>分类名称</label>
                    <input type="text" id="category-name" required maxlength="100" placeholder="请输入分类名称">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn" onclick="closeModal('category-modal')">取消</button>
                    <button type="submit" class="btn btn-primary">确定</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 模态框：添加/编辑物品 -->
    <div id="item-modal" class="modal hidden">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h3 id="item-modal-title">添加物品</h3>
                <button class="modal-close" onclick="closeModal('item-modal')">&times;</button>
            </div>
            <form onsubmit="handleItemSubmit(event)">
                <input type="hidden" id="item-edit-id">
                <div class="form-group">
                    <label>物品名称 <span class="required">*</span></label>
                    <input type="text" id="item-name" required maxlength="255" placeholder="请输入物品名称">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>分类 <span class="required">*</span></label>
                        <select id="item-category" required>
                            <option value="">请选择分类</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>厂家</label>
                        <input type="text" id="item-manufacturer" maxlength="255" placeholder="请输入厂家">
                    </div>
                </div>
                <div class="form-group">
                    <label>用途</label>
                    <textarea id="item-usage" rows="2" placeholder="请输入用途"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>生产日期 <span class="required">*</span></label>
                        <input type="date" id="item-prod-date" required>
                    </div>
                    <div class="form-group">
                        <label>过期日期 <span class="required">*</span></label>
                        <input type="date" id="item-exp-date" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>图片</label>
                    <input type="file" id="item-image" accept="image/*" onchange="handleImageUpload(event)">
                    <img id="item-image-preview" class="image-preview hidden" alt="预览">
                    <input type="hidden" id="item-image-url">
                </div>
                <div class="form-group">
                    <label>物品归属</label>
                    <div class="radio-group">
                        <label><input type="radio" name="item-private" value="false" checked> 组共享</label>
                        <label><input type="radio" name="item-private" value="true"> 私有</label>
                    </div>
                    <small class="form-hint">组共享物品将记录到组账号表中，所有组成员可见；私有物品仅自己可见</small>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn" onclick="closeModal('item-modal')">取消</button>
                    <button type="submit" class="btn btn-primary">确定</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 模态框：组信息 -->
    <div id="group-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>组信息</h3>
                <button class="modal-close" onclick="closeModal('group-modal')">&times;</button>
            </div>
            <div id="group-info-content"></div>
            <div class="sidebar-section">
                <h4>加入组</h4>
                <form onsubmit="handleJoinGroup(event)" class="inline-form">
                    <input type="text" id="join-group-name" placeholder="输入组账号名称" required>
                    <button type="submit" class="btn btn-small btn-primary">加入</button>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeModal('group-modal')">关闭</button>
            </div>
        </div>
    </div>

    <!-- 模态框：物品详情 -->
    <div id="item-detail-modal" class="modal hidden">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h3>物品详情</h3>
                <button class="modal-close" onclick="closeModal('item-detail-modal')">&times;</button>
            </div>
            <div id="item-detail-content"></div>
            <div class="modal-footer">
                <button class="btn" onclick="closeModal('item-detail-modal')">关闭</button>
            </div>
        </div>
    </div>

    <!-- 模态框：添加/编辑保养计划 -->
    <div id="maint-plan-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="maint-plan-modal-title">添加保养计划</h3>
                <button class="modal-close" onclick="closeModal('maint-plan-modal')">&times;</button>
            </div>
            <form onsubmit="handleMaintPlanSubmit(event)">
                <input type="hidden" id="maint-plan-edit-id">
                <div class="form-group">
                    <label>设备名称 <span class="required">*</span></label>
                    <input type="text" id="maint-plan-name" required maxlength="100" placeholder="如：净水器、汽车">
                </div>
                <div class="form-group">
                    <label>图标</label>
                    <div class="emoji-picker">
                        <label class="emoji-option"><input type="radio" name="maint-plan-icon" value="💧" checked><span>💧</span></label>
                        <label class="emoji-option"><input type="radio" name="maint-plan-icon" value="🚗"><span>🚗</span></label>
                        <label class="emoji-option"><input type="radio" name="maint-plan-icon" value="🏠"><span>🏠</span></label>
                        <label class="emoji-option"><input type="radio" name="maint-plan-icon" value="🔧"><span>🔧</span></label>
                        <label class="emoji-option"><input type="radio" name="maint-plan-icon" value="⚡"><span>⚡</span></label>
                        <label class="emoji-option"><input type="radio" name="maint-plan-icon" value="🛁"><span>🛁</span></label>
                        <label class="emoji-option"><input type="radio" name="maint-plan-icon" value="🌿"><span>🌿</span></label>
                        <label class="emoji-option"><input type="radio" name="maint-plan-icon" value="❄️"><span>❄️</span></label>
                    </div>
                </div>
                <div class="form-group">
                    <label>备注</label>
                    <textarea id="maint-plan-desc" rows="2" placeholder="备注说明（可选）"></textarea>
                </div>
                <div class="form-group" id="maint-template-group">
                    <label>快捷模板</label>
                    <select id="maint-plan-template">
                        <option value="">不使用模板</option>
                        <option value="water_purifier">💧 净水器（1-5级滤芯）</option>
                        <option value="car">🚗 汽车保养（机油/机滤）</option>
                    </select>
                    <small class="form-hint">选择模板将自动创建常用保养项</small>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn" onclick="closeModal('maint-plan-modal')">取消</button>
                    <button type="submit" class="btn btn-primary">确定</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 模态框：添加/编辑保养项 -->
    <div id="maint-item-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="maint-item-modal-title">添加保养项</h3>
                <button class="modal-close" onclick="closeModal('maint-item-modal')">&times;</button>
            </div>
            <form onsubmit="handleMaintItemSubmit(event)">
                <input type="hidden" id="maint-item-edit-id">
                <input type="hidden" id="maint-item-plan-id">
                <div class="form-group">
                    <label>保养项名称 <span class="required">*</span></label>
                    <input type="text" id="maint-item-name" required maxlength="100" placeholder="如：1级滤芯、机油">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>更换周期（天）<span class="required">*</span></label>
                        <input type="number" id="maint-item-cycle" required min="1" max="3650" placeholder="如30">
                    </div>
                    <div class="form-group">
                        <label>上次完成日期</label>
                        <input type="date" id="maint-item-last-done">
                    </div>
                </div>
                <div class="form-group">
                    <label>排序序号</label>
                    <input type="number" id="maint-item-sort" min="0" max="999" placeholder="0" value="0">
                    <small class="form-hint">数字越小排越前</small>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn" onclick="closeModal('maint-item-modal')">取消</button>
                    <button type="submit" class="btn btn-primary">确定</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 模态框：保养记录 -->
    <div id="maint-records-modal" class="modal hidden">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h3>保养记录</h3>
                <button class="modal-close" onclick="closeModal('maint-records-modal')">&times;</button>
            </div>
            <div id="maint-records-content" style="max-height:60vh;overflow-y:auto;"></div>
        </div>
    </div>

    <!-- 模态框：提交意见 -->
    <div id="suggestion-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>提交意见</h3>
                <button class="modal-close" onclick="closeModal('suggestion-modal')">&times;</button>
            </div>
            <form id="suggestion-form" onsubmit="handleSuggestionSubmit(event)">
                <div class="form-group">
                    <label>意见内容</label>
                    <textarea id="suggestion-content" rows="4" placeholder="请输入您的意见或建议..." required></textarea>
                </div>
                <div class="form-group">
                    <label>附件（可选，最大50MB）</label>
                    <input type="file" id="suggestion-file">
                    <div id="suggestion-file-name" class="file-name-preview"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn" onclick="closeModal('suggestion-modal')">取消</button>
                    <button type="submit" class="btn btn-primary">提交</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 模态框：确认删除 -->
    <div id="confirm-modal" class="modal hidden">
        <div class="modal-content modal-small">
            <div class="modal-header">
                <h3>确认操作</h3>
                <button class="modal-close" onclick="closeModal('confirm-modal')">&times;</button>
            </div>
            <p id="confirm-message"></p>
            <div class="modal-footer">
                <button class="btn" onclick="closeModal('confirm-modal')">取消</button>
                <button id="confirm-btn" class="btn btn-danger">确认</button>
            </div>
        </div>
    </div>

    <!-- 模态框：注销账号 -->
    <div id="delete-account-modal" class="modal hidden">
        <div class="modal-content modal-small">
            <div class="modal-header">
                <h3>注销账号</h3>
                <button class="modal-close" onclick="closeModal('delete-account-modal')">&times;</button>
            </div>
            <p>注销后数据将无法恢复，请输入密码确认：</p>
            <div class="form-group">
                <input type="password" id="delete-account-password" placeholder="请输入密码" required>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeModal('delete-account-modal')">取消</button>
                <button class="btn btn-danger" onclick="handleDeleteAccount()">确认注销</button>
            </div>
        </div>
    </div>

    <!-- Toast 通知 -->
    <div id="toast-container"></div>

    <script src="/static/js/app.js?v=20260824b"></script>
</body>
</html>
